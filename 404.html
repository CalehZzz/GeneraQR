<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir enlace · GeneraQR</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A84FF">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A84FF'/%3E%3Crect x='20' y='20' width='22' height='22' rx='4' fill='white'/%3E%3Crect x='58' y='20' width='22' height='22' rx='4' fill='white'/%3E%3Crect x='20' y='58' width='22' height='22' rx='4' fill='white'/%3E%3Crect x='62' y='62' width='14' height='14' rx='3' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --surface-soft:#FBFBFC;
    --text:#1D1D1F;
    --text-dim:#6E6E73;
    --text-faint:#A1A1A6;
    --accent:#0A84FF;
    --accent-soft:rgba(10,132,255,0.10);
    --border:#E5E5EA;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg:0 8px 24px rgba(0,0,0,0.08), 0 24px 64px rgba(0,0,0,0.10);
  }
  *{box-sizing:border-box;}
  /* .cta y .home fijan display, que por sí solo ganaría al atributo hidden */
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Inter',"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:28px 18px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:520px;height:520px;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.35;
    pointer-events:none;
    z-index:0;
  }
  body::before{
    background:radial-gradient(circle, #9ecbff, transparent 70%);
    top:-190px; left:-170px;
  }
  body::after{
    background:radial-gradient(circle, #cfe4ff, transparent 70%);
    bottom:-210px; right:-190px;
  }
  .card{
    position:relative; z-index:1;
    width:100%; max-width:440px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:28px;
    padding:34px 28px 28px;
    box-shadow:var(--shadow-lg);
    text-align:center;
  }
  .brand{
    font-weight:800; font-size:12px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--accent); margin-bottom:20px;
  }
  .spinner{
    width:38px;height:38px;margin:0 auto 18px;
    border:3px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{font-size:clamp(23px,5vw,30px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 10px;}
  .message{margin:0 0 18px; color:var(--text-dim); font-size:15px; line-height:1.5;}
  .dest{
    display:inline-flex; align-items:center; gap:8px; max-width:100%;
    padding:10px 14px; border-radius:999px;
    background:var(--accent-soft);
    border:1px solid rgba(10,132,255,0.18);
    color:var(--accent); font-size:13px; font-weight:700;
    word-break:break-all; margin-bottom:22px;
  }
  .dest span{color:var(--text-dim);font-weight:500;}
  .cta{
    display:block; width:100%; border:none; border-radius:100px; padding:15px 18px;
    font:inherit; font-weight:700; font-size:15px; color:#fff;
    background:var(--accent); cursor:pointer;
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .cta:hover{box-shadow:0 6px 18px rgba(10,132,255,0.32);}
  .cta:active{transform:scale(0.98);}
  .cta:disabled{opacity:0.6;cursor:wait;}
  .countdown{margin:14px 0 0; font-size:13px; color:var(--text-faint); min-height:1.2em; font-weight:600;}
  .cta.retry{margin-top:6px;}
  .skip{display:inline-block; margin-top:12px; color:var(--text-dim); font-size:13px; font-weight:600; text-decoration:none;}
  .skip:hover{color:var(--accent);}
  .home{display:inline-block; margin-top:18px; color:var(--accent); font-weight:600; font-size:13px; text-decoration:none;}
  body.is-error .spinner{display:none;}
  body.is-ready .spinner{display:none;}
  #landing-ready{display:none;}
  body.is-ready #landing-ready{display:block;}
  body.is-ready #landing-loading{display:none;}
</style>
<script>
  // Si no es un QR corto /r/CODIGO, ir al inicio sin cargar nada más.
  (function () {
    var path = location.pathname || '';
    if (!/\/r\/[A-Za-z0-9_-]+\/?$/.test(path)) {
      location.replace('/');
    }
  })();
</script>
</head>
<body>
  <div class="card">
    <div class="brand">GeneraQR</div>
    <div id="landing-loading">
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="redirect-status">Abriendo…</h1>
      <p class="message" id="redirect-detail"></p>
    </div>
    <div id="landing-ready">
      <h1 id="landing-title">Continuar</h1>
      <p class="message" id="landing-message"></p>
      <div class="dest" id="landing-dest"><span>Ir a</span> <strong id="landing-host">—</strong></div>
      <button type="button" class="cta" id="landing-cta">Abrir enlace</button>
      <p class="countdown" id="landing-countdown"></p>
      <a class="skip" id="landing-skip" href="#" hidden>Abrir ahora</a>
    </div>
    <button type="button" class="cta retry" id="redirect-retry" hidden>Reintentar</button>
    <a class="home" id="redirect-home" href="/" hidden>Volver a GeneraQR</a>
  </div>

  <script src="/firebase-config.js"></script>
  <script src="/js/redirect.js"></script>
</body>
</html>
